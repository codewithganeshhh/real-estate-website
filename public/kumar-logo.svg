<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#A77E15" />
      <stop offset="100%" stop-color="#6F5105" />
    </linearGradient>
    <linearGradient id="logoGoldFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D6" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- 1. Left Vertical Monolithic Pillar (Foundational Column) -->
    <path d="M 18 26 L 34 10 L 34 90 L 18 90 Z" fill="url(#logoGold)" />
    <!-- 3D Bevel Facet on Pillar -->
    <path d="M 34 10 L 40 16 L 40 90 L 34 90 Z" fill="url(#logoGoldFacet)" opacity="0.9" />

    <!-- 2. Upper Soaring Tower Wing (Upper Arm of "K") -->
    <path d="M 46 48 L 78 14 L 90 24 L 58 60 Z" fill="url(#logoGold)" />
    <!-- Bevel Facet on Upper Wing -->
    <path d="M 78 14 L 90 24 L 90 16 Z" fill="#FFF9D6" />

    <!-- 3. Lower Foundation Strut (Lower Arm of "K") -->
    <path d="M 52 56 L 88 90 L 72 90 L 42 64 Z" fill="url(#logoGold)" />

    <!-- 4. Central Emerald Keystone (IGBC Gold Sustainable Engineering) -->
    <polygon points="45,53 51,47 57,53 51,59" fill="url(#logoEmerald)" />
  </g>
</svg>
