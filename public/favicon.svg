<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Luxury Obsidian Backing for high contrast on any browser theme -->
  <rect width="100" height="100" rx="22" fill="#0A0A0A" />
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.4" />
  
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#A77E15" />
      <stop offset="100%" stop-color="#6F5105" />
    </linearGradient>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Left Architectural Pillar (Monolith) -->
  <path d="M 22 28 L 36 14 L 36 86 L 22 86 Z" fill="url(#favGold)" />
  <path d="M 36 14 L 41 19 L 41 86 L 36 86 Z" fill="#FFE885" opacity="0.85" />

  <!-- Upper Tower Spire (K-Arm) -->
  <path d="M 46 48 L 74 18 L 84 26 L 56 58 Z" fill="url(#favGold)" />
  <path d="M 74 18 L 84 26 L 84 19 Z" fill="#FFE885" />

  <!-- Lower Foundation Strut (K-Leg) -->
  <path d="M 51 54 L 82 86 L 68 86 L 42 61 Z" fill="url(#favGold)" />

  <!-- Central Emerald Keystone (Sustainability & Engineering) -->
  <polygon points="45,51 50,46 55,51 50,56" fill="url(#favEmerald)" />
</svg>
